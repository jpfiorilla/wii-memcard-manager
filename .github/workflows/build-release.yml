name: Build release binaries

# One release = one version for both halves: the Mac/Windows app and TM Sync (Wii homebrew).
# TM Sync is built first and bundled inside the app (which installs it onto Wii SD cards); the
# SD-ready tm-sync-<version>.zip is also attached to the release for manual installs.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  tm-sync:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches package.json and TM Sync versions
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          app=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' package.json | head -1)
          wii=$(sed -n 's/.*TMSYNC_VERSION "\([^"]*\)".*/\1/p' tm-sync/source/version.h)
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag app=$app tm-sync=$wii"
          test "$tag" = "$app" && test "$tag" = "$wii"

      - name: Build TM Sync
        run: make -C tm-sync package

      - uses: actions/upload-artifact@v4
        with:
          name: tm-sync-dist
          path: tm-sync/dist/
          if-no-files-found: error

  build:
    needs: tm-sync
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tm-sync-dist
          path: tm-sync/dist

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm test -- --run

      - name: Electron build (bundles TM Sync; unsigned mac / Windows installer)
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Collect installers (mac zip / Windows NSIS)
        shell: bash
        run: |
          mkdir -p installers
          find release -name 'Wii Memcard Manager_*.zip' -exec cp {} installers/ \;
          find release -name 'Wii Memcard Manager_*.exe' -exec cp {} installers/ \;
          find installers -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: installers/
          if-no-files-found: error

  publish-to-release:
    needs: [tm-sync, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: tm-sync-dist
          path: tm-sync-dist

      - name: Zip TM Sync for the SD card
        run: cd tm-sync-dist && zip -r "../assets/tm-sync-${GITHUB_REF_NAME#v}.zip" apps

      - name: List release files
        run: find assets -type f | sort

      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          working_directory: assets
          files: |
            *.zip
            *.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
