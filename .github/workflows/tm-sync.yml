name: TM Sync (Wii app)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tm-sync/**", ".github/workflows/tm-sync.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["tm-sync/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build boot.dol
        run: make -C tm-sync package
      - name: Zip for the SD card
        run: cd tm-sync/dist && apt-get update -qq && apt-get install -y -qq zip >/dev/null && zip -r ../../tm-sync.zip apps
      - uses: actions/upload-artifact@v4
        with:
          name: tm-sync
          path: tm-sync.zip
          if-no-files-found: error
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: tm-sync.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
