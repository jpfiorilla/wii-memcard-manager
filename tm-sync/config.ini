# TM Sync settings. Lines starting with # are comments.

# The Mac running Wii Memcard Manager. Leave blank to find it automatically.
host=
port=8642

# Memory card to sync (TM:CE = GTME) and where Nintendont keeps it.
game=GTME
saves_dir=sd:/saves

# After syncing, start Nintendont (regular, not Slippi: TM:CE needs memory card emulation). Blank paths = auto-detect.
launch=1
autoboot=1
nintendont=
nincfg=

# Seconds to spend on Wi-Fi + download before giving up and booting normally.
# The Wii's Wi-Fi often needs 8-15 s to associate and get an address.
timeout=20
keep_backups=5
pause_ms=800
